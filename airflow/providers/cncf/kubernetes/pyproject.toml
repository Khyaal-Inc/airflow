[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apache-airflow-providers-cncf-kubernetes"
version = "8.3.1.post1+khyaal"
description = "Apache Airflow Providers for CNCF Kubernetes (Khyaal custom build)"
readme = "CHANGELOG.rst"
license = {text = "Apache License 2.0"}
requires-python = "~=3.8"
authors = [
    {name = "Apache Software Foundation", email = "dev@airflow.apache.org"},
]
keywords = ["airflow", "provider", "kubernetes"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "aiofiles>=23.2.0",
    "apache-airflow>=2.7.0",
    "asgiref>=3.5.2",
    "cryptography>=41.0.0",
    "kubernetes>=28.1.0,<=29.0.0",
    "kubernetes_asyncio>=28.1.0,<=29.0.0",
]

[project.urls]
Homepage = "https://github.com/Khyaal-Inc/airflow"
Documentation = "https://airflow.apache.org/docs/apache-airflow-providers-cncf-kubernetes/8.3.1/"
"Bug Tracker" = "https://github.com/Khyaal-Inc/airflow/issues"
"Source Code" = "https://github.com/Khyaal-Inc/airflow"

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow.providers.cncf.kubernetes:get_provider_info"

[tool.hatch.build]
# Set the directory where hatchling should look for packages
# This tells hatchling the root is 4 levels up from pyproject.toml
directory = "../../../.."

[tool.hatch.build.targets.wheel]
# Include only the airflow.providers.cncf.kubernetes package
packages = ["airflow/providers/cncf/kubernetes"]

[tool.hatch.build.targets.sdist]
include = [
    "airflow/providers/cncf/kubernetes/**/*.py",
    "airflow/providers/cncf/kubernetes/**/*.yaml",
    "airflow/providers/cncf/kubernetes/**/*.jinja2",
    "airflow/providers/cncf/kubernetes/**/*.rst",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "**/venv*",
    "**/.git*",
]
